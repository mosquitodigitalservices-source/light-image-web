<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self' 'wasm-unsafe-eval'; worker-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' blob: data:; connect-src 'self' blob:; base-uri 'none'; form-action 'none'; object-src 'none'">
<meta name="referrer" content="no-referrer">
<title>Compressor · Light Image</title>
<meta name="description" content="Comprime imágenes sin cambiar sus dimensiones ni los archivos originales. Todo se procesa en tu navegador.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Jost:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../styles.css">
<link rel="stylesheet" href="compressor.css">
</head>
<body>
<header class="top">
  <div class="brand">Light Image</div>
  <nav class="tools" aria-label="Light Image">
    <a href="./" aria-current="page">Compressor</a>
    <a href="../disktree/">Disktree</a>
    <a href="../">Color Palette</a>
  </nav>
  <div class="lang" role="group" aria-label="Idioma / Language">
    <button type="button" data-lang="es">ES</button>
    <button type="button" data-lang="en">EN</button>
  </div>
</header>

<main>
  <div class="page-title">
    <h1 class="eyebrow">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="7" y="7" width="14" height="12" rx="2"/><path d="M3 15V5a2 2 0 0 1 2-2h12"/><circle cx="12" cy="11" r="1.2"/><path d="m21 16-4-4-6 6"/></svg>
      COMPRESSOR
    </h1>
    <span class="info">
      <button type="button" class="info-btn" aria-describedby="leadTip" data-i18n-aria="aboutTool">i</button>
      <span class="tip" role="tooltip" id="leadTip" data-i18n="lead"></span>
    </span>
  </div>

  <div class="cx-grid">
    <div class="cx-controls">
      <div class="row">
        <button type="button" class="btn primary" id="addFilesBtn">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
          <span data-i18n="addImages"></span>
        </button>
        <button type="button" class="btn" id="addFolderBtn">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2Z"/><path d="M12 10v6M9 13h6"/></svg>
          <span data-i18n="addFolder"></span>
        </button>
        <span class="info">
          <button type="button" class="info-btn" aria-describedby="dropTip" data-i18n-aria="aboutImport">i</button>
          <span class="tip" role="tooltip" id="dropTip" data-i18n="dropHint"></span>
        </span>
      </div>
      <input type="file" id="fileInput" multiple accept="image/jpeg,image/png,image/webp,image/heic,image/heif,.jpg,.jpeg,.png,.webp,.heic,.heif" hidden>
      <input type="file" id="folderInput" webkitdirectory multiple hidden>

      <div class="banner" id="banner" role="status" hidden>
        <span id="bannerText"></span>
        <button type="button" class="icon-btn" id="bannerClose" data-i18n-aria="close">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"/></svg>
        </button>
      </div>

      <section class="box">
        <h2 class="sec"><span class="num">02</span><span data-i18n="compTitle"></span><small data-i18n="compSub"></small></h2>
        <label class="opt"><span data-i18n="preset"></span>
          <select class="input sel" id="preset">
            <option value="lossless">Lossless</option>
            <option value="highQuality">High Quality</option>
            <option value="balanced">Balanced</option>
            <option value="smallFile">Small File</option>
            <option value="custom">Custom</option>
          </select>
        </label>
        <p class="preset-summary" id="presetSummary"></p>
        <p class="hint" id="presetDetail"></p>
        <label class="switch opt"><span data-i18n="keepMeta"></span><input type="checkbox" id="preservesMetadata"></label>
        <label class="switch opt"><span data-i18n="keepIcc"></span><input type="checkbox" id="preservesColorProfile"></label>
        <div class="quality">
          <div class="quality-head"><span id="qualityLabel"></span></div>
          <div class="quality-row">
            <span class="mono">60</span>
            <input class="range" id="quality" type="range" min="60" max="100" step="1" data-i18n-aria="qualityAria">
            <span class="mono">100</span>
          </div>
        </div>
      </section>

      <section class="box">
        <h2 class="sec"><span class="num">03</span><span data-i18n="formatTitle"></span><small data-i18n="formatSub"></small></h2>
        <label class="opt"><span data-i18n="outputFormat"></span>
          <select class="input sel" id="outputFormat">
            <option value="keepOriginal" data-i18n="keepFormat"></option>
            <option value="jpeg">JPEG</option>
            <option value="png">PNG</option>
            <option value="webp">WebP</option>
            <option value="heic">HEIC</option>
          </select>
        </label>
        <p class="note">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="M7 9v6M17 9v6"/></svg>
          <span><strong data-i18n="noResize"></strong> <span data-i18n="noResizeDetail"></span></span>
        </p>
        <p class="warn-note" id="heicNote" data-i18n="heicNote" hidden></p>
      </section>

      <section class="box">
        <h2 class="sec"><span class="num">04</span><span data-i18n="destTitle"></span><small data-i18n="destSub"></small></h2>
        <div class="dest-row">
          <div class="dest-info" id="destInfo"></div>
          <button type="button" class="btn" id="destBtn"><span id="destBtnLabel"></span></button>
        </div>
        <p class="dest-hint" id="destHint"></p>
      </section>

      <section class="box">
        <div class="prog-head">
          <h2 class="sec"><span class="num">05</span><span data-i18n="progTitle"></span><small data-i18n="progSub"></small></h2>
          <span class="mono" id="progCount"></span>
        </div>
        <div class="bar" role="progressbar" aria-valuemin="0" aria-valuemax="100" id="progressBar" data-i18n-aria="progressAria"><span id="progressFill"></span></div>
        <dl class="summary" id="summary" hidden></dl>
      </section>

      <div class="actions">
        <button type="button" class="btn primary" id="compressBtn">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 14h6v6M20 10h-6V4M14 10l7-7M3 21l7-7"/></svg>
          <span id="compressLabel"></span>
        </button>
        <button type="button" class="btn" id="zipBtn" hidden data-i18n="downloadZip"></button>
        <button type="button" class="link danger" id="clearBtn" data-i18n="clearList"></button>
      </div>
      <p class="hint" data-i18n="originalsSafe"></p>
    </div>

    <section class="box cx-files">
      <div class="files-head">
        <h2 class="sec"><span class="num">01</span><span data-i18n="filesTitle"></span><small data-i18n="filesSub"></small></h2>
        <span class="mono" id="filesCount"></span>
      </div>
      <div class="file-cols" aria-hidden="true">
        <span data-i18n="colName"></span><span data-i18n="colOriginal"></span><span data-i18n="colResult"></span><span data-i18n="colReduction"></span><span data-i18n="colStatus"></span>
      </div>
      <ul class="files" id="files"></ul>
      <div class="empty-state" id="emptyState">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="2"/><circle cx="9" cy="10" r="1.6"/><path d="m21 16-5-5-8 8"/></svg>
        <p data-i18n="emptyTitle"></p>
        <p class="hint" data-i18n="emptyDetail"></p>
      </div>
    </section>
  </div>
</main>

<div class="drop-overlay" id="dropOverlay" hidden><p data-i18n="dropOverlay"></p></div>

<script type="module" src="compressor.js"></script>
</body>
</html>
