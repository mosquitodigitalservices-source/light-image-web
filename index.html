<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self' https://cdnjs.cloudflare.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' blob: data:; connect-src 'self' blob: data:; base-uri 'none'; form-action 'none'; object-src 'none'">
<meta name="referrer" content="no-referrer">
<title>Color Palette · Light Image</title>
<meta name="description" content="Extrae paletas de color de tus imágenes y expórtalas en PDF. Todo se procesa en tu navegador.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Jost:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js" integrity="sha512-qZvrmS2ekKPF2mSznTQsxqPgnpkI4DNTlrdUmTzrDgektczlKNRRhy5X5AAOnx5S09ydFYWWNSfcEqDTTHgtNA==" crossorigin="anonymous" referrerpolicy="no-referrer"></script>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<header class="top">
  <div class="brand">Light Image</div>
  <nav class="tools" aria-label="Light Image">
    <a href="compressor/">Compressor</a>
    <a href="disktree/">Disktree</a>
    <a href="./" aria-current="page">Color Palette</a>
  </nav>
  <div class="lang" role="group" aria-label="Idioma / Language">
    <button type="button" data-lang="es">ES</button>
    <button type="button" data-lang="en">EN</button>
  </div>
</header>

<main>
  <div class="page-title">
    <h1 class="eyebrow">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" aria-hidden="true"><path d="M12 21a9 9 0 1 1 9-9c0 2.5-2 3.5-4 3.5h-1.8a1.7 1.7 0 0 0-1.2 2.9 1.6 1.6 0 0 1-1.2 2.6Z"/><circle cx="7.5" cy="11" r="1"/><circle cx="11" cy="7" r="1"/><circle cx="15.5" cy="8" r="1"/></svg>
    COLOR PALETTE
    </h1>
    <span class="info"><button type="button" class="info-btn" aria-describedby="leadTip" data-i18n-aria="aboutTool">i</button><span class="tip" role="tooltip" id="leadTip" data-i18n="lead"></span></span>
  </div>

  <section>
    <h2 class="sec"><span class="num">01</span><span data-i18n="importTitle"></span><small data-i18n="importSub"></small></h2>
    <div class="row">
      <button type="button" class="btn primary" id="pickFiles">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="2"/><circle cx="9" cy="10" r="1.6"/><path d="m21 16-5-5-8 8"/></svg>
        <span data-i18n="browse"></span>
      </button>
      <button type="button" class="btn" id="pickFolder">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2Z"/></svg>
        <span data-i18n="folder"></span>
      </button>
      <span class="info"><button type="button" class="info-btn" aria-describedby="importTip" data-i18n-aria="aboutImport">i</button><span class="tip" role="tooltip" id="importTip" data-i18n="importHint"></span></span>
      <span class="count" id="count"></span>
      <button type="button" class="link danger" id="clear" data-i18n="clear"></button>
    </div>
    <input type="file" id="fileInput" multiple accept="image/*,.heic,.heif,.tif,.tiff" hidden>
    <input type="file" id="folderInput" webkitdirectory multiple hidden>
  </section>

  <div class="notice" id="notice" role="status" hidden>
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 11v5M12 8h.01"/></svg>
    <span id="noticeText"></span>
    <button type="button" class="icon-btn" id="noticeClose" data-i18n-aria="close">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"/></svg>
    </button>
  </div>

  <div class="cols">
    <section class="box">
      <h2 class="sec"><span class="num">02</span><span data-i18n="colorsTitle"></span><small data-i18n="colorsSub"></small></h2>
      <div class="field">
        <span data-i18n="amount"></span>
        <div class="seg" id="seg" role="group">
          <button type="button" data-n="4">4</button>
          <button type="button" data-n="8">8</button>
          <button type="button" data-n="16">16</button>
          <button type="button" data-n="24">24</button>
          <button type="button" data-n="32">32</button>
        </div>
      </div>
    </section>

    <section class="box">
      <h2 class="sec"><span class="num">03</span><span data-i18n="exportTitle"></span><small data-i18n="exportSub"></small></h2>
      <input class="input" id="header" type="text" maxlength="120" data-i18n-ph="headerPh">
      <label class="switch"><input type="checkbox" id="titles"><span data-i18n="titles"></span></label>
      <button type="button" class="btn primary" id="exportBtn">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8Z"/><path d="M14 3v5h5M9 13h6M9 17h4"/></svg>
        <span data-i18n="exportBtn"></span>
      </button>
    </section>

    <section class="box">
      <h2 class="sec"><span class="num">04</span><span data-i18n="bgTitle"></span><small data-i18n="bgSub"></small></h2>
      <div class="wheel-wrap">
        <div>
          <div class="wheel" id="wheel">
            <canvas id="wheelCanvas" width="264" height="264"></canvas>
            <div class="knob" id="knob"></div>
          </div>
          <input class="range" id="value" type="range" min="0" max="100" step="1" data-i18n-aria="brightness">
        </div>
        <div class="bg-info">
          <div class="bg-dot" id="bgDot"></div>
          <input class="hex-in" id="hexIn" type="text" maxlength="7" spellcheck="false" aria-label="Hex">
        </div>
      </div>
    </section>
  </div>

  <section>
    <h2 class="sec"><span class="num">05</span><span data-i18n="resultsTitle"></span><small data-i18n="resultsSub"></small></h2>
    <p class="empty" id="empty" data-i18n="empty"></p>
    <div class="results" id="results"></div>
  </section>
</main>

<div class="drop-overlay" id="dropOverlay" hidden><p data-i18n="dropHint"></p></div>

<div class="modal" id="modal" hidden>
  <div class="dialog" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
    <div class="dlg-head">
      <div>
        <h2 id="modalTitle"><span data-i18n="previewTitle"></span> <span class="info"><button type="button" class="info-btn" aria-describedby="previewTip" data-i18n-aria="aboutPreview">i</button><span class="tip" role="tooltip" id="previewTip" data-i18n="previewSub"></span></span></h2>
      </div>
      <button type="button" class="icon-btn" id="modalClose" data-i18n-aria="close">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"/></svg>
      </button>
    </div>
    <div class="pages" id="pages"></div>
    <div class="dlg-foot">
      <button type="button" class="btn" id="cancelBtn" data-i18n="cancel"></button>
      <button type="button" class="btn primary" id="saveBtn" data-i18n="exportFinal"></button>
    </div>
  </div>
</div>

<div class="ctx" id="ctx" role="menu" hidden>
  <button type="button" role="menuitem" data-move="forward" data-i18n="moveForward"></button>
  <button type="button" role="menuitem" data-move="back" data-i18n="moveBack"></button>
  <hr>
  <button type="button" role="menuitem" data-move="first" data-i18n="moveFirst"></button>
  <button type="button" role="menuitem" data-move="last" data-i18n="moveLast"></button>
</div>

<script src="app.js"></script>
<script src="info-tips.js"></script>
</body>
</html>
