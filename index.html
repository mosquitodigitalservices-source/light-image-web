<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self' https://cdnjs.cloudflare.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' blob: data:; connect-src 'self' blob: data:; base-uri 'none'; form-action 'none'; object-src 'none'">
<meta name="referrer" content="no-referrer">
<title>Color Palette · Light Image</title>
<meta name="description" content="Extrae paletas de color de tus imágenes y expórtalas en PDF. Todo se procesa en tu navegador.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Jost:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js" integrity="sha512-qZvrmS2ekKPF2mSznTQsxqPgnpkI4DNTlrdUmTzrDgektczlKNRRhy5X5AAOnx5S09ydFYWWNSfcEqDTTHgtNA==" crossorigin="anonymous" referrerpolicy="no-referrer"></script>
<style>
:root{
  --bg:#1a2028;--panel:#242d36;--panel-2:#1d252d;--line:#36424d;--line-2:#4a5866;
  --text:#e9eef2;--muted:#9aa8b4;--faint:#6f7d89;
  --accent:#a8c5d5;--accent-ink:#132029;--accent-soft:rgba(168,197,213,.14);
  --danger:#ff6b5e;--radius:12px;--ctl:8px;
  --sans:"Jost",system-ui,-apple-system,sans-serif;--mono:"JetBrains Mono",ui-monospace,Menlo,monospace;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text);font-family:var(--sans);font-size:16px;line-height:1.5;-webkit-font-smoothing:antialiased}
button,input{font:inherit;color:inherit}
button{cursor:pointer}
[hidden]{display:none!important}
.top{display:flex;align-items:center;justify-content:space-between;padding:18px 32px;border-bottom:1px solid var(--line)}
.brand{font-weight:500;font-size:18px;letter-spacing:.01em}
.lang{display:flex;border:1px solid var(--line-2);border-radius:var(--ctl);overflow:hidden}
.lang button{background:none;border:0;padding:4px 12px;font-size:13px;font-weight:500;color:var(--muted)}
.lang button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
main{max-width:1280px;margin:0 auto;padding:40px 32px 80px}
.eyebrow{display:flex;align-items:center;gap:10px;margin:0 0 8px;font-size:13px;font-weight:600;letter-spacing:.16em;color:var(--accent)}
h1{margin:0 0 6px;font-size:clamp(30px,4vw,42px);font-weight:600;letter-spacing:-.01em;line-height:1.15}
.lead{margin:0 0 36px;color:var(--muted);font-size:17px}
.sec{display:flex;align-items:baseline;flex-wrap:wrap;gap:10px;margin:0 0 14px;font-size:17px;font-weight:600;letter-spacing:.04em;text-transform:uppercase}
.sec .num{font-family:var(--mono);font-size:13px;font-weight:400;color:var(--muted);letter-spacing:0}
.sec small{font-size:13px;font-weight:400;letter-spacing:0;text-transform:none;color:var(--muted)}
section{margin-bottom:32px}
.row{display:flex;align-items:center;flex-wrap:wrap;gap:12px}
.btn{display:inline-flex;align-items:center;gap:10px;padding:10px 18px;border-radius:var(--ctl);border:1px solid var(--line-2);background:none;font-weight:500;transition:background .15s,border-color .15s}
.btn:hover{background:var(--accent-soft);border-color:var(--accent)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{background:#bcd4e1}
.btn svg{width:18px;height:18px;flex:none}
.count{font-family:var(--mono);font-size:14px;color:var(--muted)}
.link{margin-left:auto;background:none;border:0;padding:6px 4px;font-weight:500}
.link.danger{color:var(--danger)}
.link:disabled{opacity:.35;cursor:default}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.notice{display:flex;align-items:center;gap:12px;margin:-12px 0 28px;padding:12px 16px;border:1px solid var(--line-2);border-radius:var(--radius);background:var(--panel-2);color:var(--text)}
.notice svg{width:18px;height:18px;flex:none;color:var(--muted)}
.notice span{flex:1}
.icon-btn{display:grid;place-items:center;width:28px;height:28px;background:none;border:0;border-radius:6px;color:var(--muted)}
.icon-btn:hover{background:var(--accent-soft);color:var(--text)}
.cols{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px;margin-bottom:36px}
.box{margin:0;padding:22px 24px;background:var(--panel);border:1px solid var(--line);border-radius:var(--radius)}
.box .sec{font-size:15px;margin-bottom:18px}
.field{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:12px}
.seg{display:flex;padding:3px;background:var(--panel-2);border-radius:var(--ctl)}
.seg button{min-width:44px;padding:5px 10px;border:0;border-radius:6px;background:none;font-size:15px;font-weight:500;color:var(--text)}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.seg button:not([aria-pressed="true"]):hover{background:var(--accent-soft)}
.input{width:100%;padding:10px 14px;border-radius:var(--ctl);border:1px solid var(--line-2);background:var(--panel-2)}
.input::placeholder{color:var(--faint)}
.input:focus{outline:none;border-color:var(--accent)}
.switch{display:flex;align-items:center;gap:14px;margin:16px 0 18px;cursor:pointer}
.switch input{appearance:none;width:46px;height:26px;margin:0;border-radius:13px;background:var(--line-2);position:relative;cursor:pointer;transition:background .15s}
.switch input::after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#fff;transition:transform .15s}
.switch input:checked{background:var(--accent)}
.switch input:checked::after{transform:translateX(20px)}
.wheel-wrap{display:flex;align-items:center;gap:22px}
.wheel{position:relative;width:132px;height:132px;flex:none;touch-action:none}
.wheel canvas{width:132px;height:132px;border-radius:50%;cursor:crosshair;display:block}
.knob{position:absolute;width:14px;height:14px;margin:-7px 0 0 -7px;border-radius:50%;border:2px solid #fff;box-shadow:0 0 0 1px rgba(0,0,0,.4);pointer-events:none}
.bg-info{display:flex;flex-direction:column;align-items:flex-start;gap:10px}
.bg-dot{width:34px;height:34px;border-radius:50%;border:1px solid var(--line-2)}
.hex-in{width:96px;padding:4px 8px;border-radius:6px;border:1px solid transparent;background:none;font-family:var(--mono);font-size:13px;color:var(--muted);text-transform:uppercase}
.hex-in:hover{border-color:var(--line-2)}
.hex-in:focus{outline:none;border-color:var(--accent);color:var(--text)}
.range{width:132px;margin:16px 0 0;appearance:none;height:6px;border-radius:3px;background:linear-gradient(90deg,#000,var(--track,#fff))}
.range::-webkit-slider-thumb{appearance:none;width:16px;height:16px;border-radius:50%;background:#fff;border:0;box-shadow:0 0 0 1px rgba(0,0,0,.4)}
.range::-moz-range-thumb{width:16px;height:16px;border-radius:50%;background:#fff;border:0}
.results{display:flex;flex-direction:column;gap:16px}
.card{padding:20px 24px 24px;background:var(--panel);border:1px solid var(--line);border-radius:var(--radius)}
.fname{margin:0 0 14px;font-family:var(--mono);font-size:14px;color:var(--text);overflow-wrap:anywhere}
.card img{display:block;width:100%;height:auto;border-radius:6px}
.plabel{margin:18px 0 10px;font-weight:600}
.swatches{display:flex;flex-wrap:wrap;gap:10px}
.sw{width:96px;border:1px solid var(--line-2);border-radius:6px;overflow:hidden;background:var(--panel-2)}
.sw span{display:block;height:58px}
.sw code{display:block;padding:5px 0;text-align:center;font-family:var(--mono);font-size:12px;color:var(--muted)}
.empty{margin:0;padding:28px;border:1px dashed var(--line-2);border-radius:var(--radius);color:var(--muted);text-align:center}
.drop-overlay{position:fixed;inset:0;z-index:30;display:grid;place-items:center;background:rgba(18,24,30,.82);border:2px dashed var(--accent);pointer-events:none}
.drop-overlay p{margin:0;font-size:20px;font-weight:500}
.modal{position:fixed;inset:0;z-index:20;display:grid;place-items:center;padding:24px;background:rgba(10,14,18,.72)}
.dialog{display:flex;flex-direction:column;width:min(1120px,100%);max-height:calc(100vh - 48px);max-height:calc(100dvh - 48px);background:var(--panel);border:1px solid var(--line-2);border-radius:16px}
.dlg-head{display:flex;align-items:flex-start;justify-content:space-between;gap:16px;padding:20px 24px 14px;border-bottom:1px solid var(--line)}
.dlg-head h2{margin:0;font-size:20px;font-weight:600}
.dlg-head p{margin:2px 0 0;font-size:14px;color:var(--muted)}
.pages{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(420px,100%),1fr));gap:24px;padding:22px 24px;overflow:auto;min-height:0}
.sheet{position:relative;user-select:none}
.sheet canvas{display:block;width:100%;height:auto;border-radius:4px;box-shadow:0 0 0 1px var(--line-2)}
.slot{position:absolute;border-radius:4px;cursor:grab}
.slot:hover{box-shadow:inset 0 0 0 2px var(--accent)}
.slot:focus-visible{outline-offset:1px}
.slot.dragging{background:rgba(10,14,18,.6)}
.slot.before::before,.slot.after::after{content:"";position:absolute;top:0;bottom:0;width:3px;border-radius:2px;background:var(--accent)}
.slot.before::before{left:-4px}
.slot.after::after{right:-4px}
.page p{margin:6px 0 0;font-family:var(--mono);font-size:12px;color:var(--muted);text-align:center}
.dlg-foot{flex:none;display:flex;justify-content:flex-end;gap:12px;padding:14px 24px 20px;border-top:1px solid var(--line)}
.ctx{position:fixed;z-index:40;min-width:200px;padding:5px;background:var(--panel);border:1px solid var(--line-2);border-radius:10px;box-shadow:0 10px 30px rgba(0,0,0,.45)}
.ctx button{display:block;width:100%;padding:7px 12px;border:0;border-radius:6px;background:none;text-align:left;font-size:14px}
.ctx button:hover:not(:disabled),.ctx button:focus-visible{background:var(--accent-soft);outline:none}
.ctx button:disabled{color:var(--faint);cursor:default}
.ctx hr{margin:4px 6px;border:0;border-top:1px solid var(--line)}
@media (max-width:960px){.cols{grid-template-columns:minmax(0,1fr)}}
@media (max-width:600px){
  .top{padding:14px 16px}main{padding:28px 16px 60px}.link{margin-left:0}
  .modal{padding:8px}
  .dialog{max-height:calc(100vh - 16px);max-height:calc(100dvh - 16px)}
  .dlg-head{padding:16px 16px 12px}
  .pages{padding:16px;gap:16px}
  .dlg-foot{padding:12px 16px calc(12px + env(safe-area-inset-bottom))}
  .dlg-foot .btn{flex:1;justify-content:center}
}
</style>
</head>
<body>
<header class="top">
  <div class="brand">Light Image</div>
  <div class="lang" role="group" aria-label="Idioma / Language">
    <button type="button" data-lang="es">ES</button>
    <button type="button" data-lang="en">EN</button>
  </div>
</header>

<main>
  <p class="eyebrow">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" aria-hidden="true"><path d="M12 21a9 9 0 1 1 9-9c0 2.5-2 3.5-4 3.5h-1.8a1.7 1.7 0 0 0-1.2 2.9 1.6 1.6 0 0 1-1.2 2.6Z"/><circle cx="7.5" cy="11" r="1"/><circle cx="11" cy="7" r="1"/><circle cx="15.5" cy="8" r="1"/></svg>
    COLOR PALETTE
  </p>
  <h1 data-i18n="title"></h1>
  <p class="lead" data-i18n="lead"></p>

  <section>
    <h2 class="sec"><span class="num">01</span><span data-i18n="importTitle"></span><small data-i18n="importSub"></small></h2>
    <div class="row">
      <button type="button" class="btn primary" id="pickFiles">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="2"/><circle cx="9" cy="10" r="1.6"/><path d="m21 16-5-5-8 8"/></svg>
        <span data-i18n="browse"></span>
      </button>
      <button type="button" class="btn" id="pickFolder">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2Z"/></svg>
        <span data-i18n="folder"></span>
      </button>
      <span class="count" id="count"></span>
      <button type="button" class="link danger" id="clear" data-i18n="clear"></button>
    </div>
    <input type="file" id="fileInput" multiple accept="image/*,.heic,.heif,.tif,.tiff" hidden>
    <input type="file" id="folderInput" webkitdirectory multiple hidden>
  </section>

  <div class="notice" id="notice" role="status" hidden>
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 11v5M12 8h.01"/></svg>
    <span id="noticeText"></span>
    <button type="button" class="icon-btn" id="noticeClose" data-i18n-aria="close">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"/></svg>
    </button>
  </div>

  <div class="cols">
    <section class="box">
      <h2 class="sec"><span class="num">02</span><span data-i18n="colorsTitle"></span><small data-i18n="colorsSub"></small></h2>
      <div class="field">
        <span data-i18n="amount"></span>
        <div class="seg" id="seg" role="group">
          <button type="button" data-n="4">4</button>
          <button type="button" data-n="8">8</button>
          <button type="button" data-n="16">16</button>
          <button type="button" data-n="24">24</button>
          <button type="button" data-n="32">32</button>
        </div>
      </div>
    </section>

    <section class="box">
      <h2 class="sec"><span class="num">03</span><span data-i18n="exportTitle"></span><small data-i18n="exportSub"></small></h2>
      <input class="input" id="header" type="text" maxlength="120" data-i18n-ph="headerPh">
      <label class="switch"><input type="checkbox" id="titles"><span data-i18n="titles"></span></label>
      <button type="button" class="btn primary" id="exportBtn">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8Z"/><path d="M14 3v5h5M9 13h6M9 17h4"/></svg>
        <span data-i18n="exportBtn"></span>
      </button>
    </section>

    <section class="box">
      <h2 class="sec"><span class="num">04</span><span data-i18n="bgTitle"></span><small data-i18n="bgSub"></small></h2>
      <div class="wheel-wrap">
        <div>
          <div class="wheel" id="wheel">
            <canvas id="wheelCanvas" width="264" height="264"></canvas>
            <div class="knob" id="knob"></div>
          </div>
          <input class="range" id="value" type="range" min="0" max="100" step="1" data-i18n-aria="brightness">
        </div>
        <div class="bg-info">
          <div class="bg-dot" id="bgDot"></div>
          <input class="hex-in" id="hexIn" type="text" maxlength="7" spellcheck="false" aria-label="Hex">
        </div>
      </div>
    </section>
  </div>

  <section>
    <h2 class="sec"><span class="num">05</span><span data-i18n="resultsTitle"></span><small data-i18n="resultsSub"></small></h2>
    <p class="empty" id="empty" data-i18n="empty"></p>
    <div class="results" id="results"></div>
  </section>
</main>

<div class="drop-overlay" id="dropOverlay" hidden><p data-i18n="dropHint"></p></div>

<div class="modal" id="modal" hidden>
  <div class="dialog" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
    <div class="dlg-head">
      <div>
        <h2 id="modalTitle" data-i18n="previewTitle"></h2>
        <p data-i18n="previewSub"></p>
      </div>
      <button type="button" class="icon-btn" id="modalClose" data-i18n-aria="close">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"/></svg>
      </button>
    </div>
    <div class="pages" id="pages"></div>
    <div class="dlg-foot">
      <button type="button" class="btn" id="cancelBtn" data-i18n="cancel"></button>
      <button type="button" class="btn primary" id="saveBtn" data-i18n="exportFinal"></button>
    </div>
  </div>
</div>

<div class="ctx" id="ctx" role="menu" hidden>
  <button type="button" role="menuitem" data-move="forward" data-i18n="moveForward"></button>
  <button type="button" role="menuitem" data-move="back" data-i18n="moveBack"></button>
  <hr>
  <button type="button" role="menuitem" data-move="first" data-i18n="moveFirst"></button>
  <button type="button" role="menuitem" data-move="last" data-i18n="moveLast"></button>
</div>

<script src="app.js"></script>
</body>
</html>
