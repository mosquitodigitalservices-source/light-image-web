<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' blob: data:; connect-src 'self' blob:; base-uri 'none'; form-action 'none'; object-src 'none'">
<meta name="referrer" content="no-referrer">
<title>Disktree · Light Image</title>
<meta name="description" content="Configura y genera la estructura de carpetas de un rodaje. Todo se procesa en tu navegador.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Jost:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../styles.css">
<link rel="stylesheet" href="disktree.css">
</head>
<body>
<header class="top">
  <div class="brand">Light Image</div>
  <nav class="tools" aria-label="Light Image">
    <a href="../compressor/">Compressor</a>
    <a href="./" aria-current="page">Disktree</a>
    <a href="../">Color Palette</a>
  </nav>
  <div class="lang" role="group" aria-label="Idioma / Language">
    <button type="button" data-lang="es">ES</button>
    <button type="button" data-lang="en">EN</button>
  </div>
</header>

<main>
  <div class="page-title">
    <h1 class="eyebrow">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2Z"/><path d="M12 10v6M9 13h6"/></svg>
    DISKTREE
    </h1>
    <span class="info"><button type="button" class="info-btn" aria-describedby="leadTip" data-i18n-aria="aboutTool">i</button><span class="tip" role="tooltip" id="leadTip" data-i18n="lead"></span></span>
  </div>

  <section class="box tplbar">
    <label class="tpl-pick">
      <span class="tpl-label" data-i18n="template"></span>
      <select class="input" id="tplSelect"></select>
    </label>
    <span class="tpl-status" id="tplStatus"></span>
    <div class="row tpl-actions">
      <button type="button" class="btn" id="saveNewBtn" data-i18n="saveNew"></button>
      <button type="button" class="btn" id="updateBtn" data-i18n="update"></button>
      <button type="button" class="btn" id="manageBtn" data-i18n="manage"></button>
    </div>
  </section>

  <section class="box">
    <h2 class="sec"><span class="num">01</span><span data-i18n="projTitle"></span><small data-i18n="projSub"></small></h2>
    <div class="grid2">
      <label class="fld"><span data-i18n="projectName"></span><input class="input" id="projectName" type="text" autocomplete="off" spellcheck="false"></label>
      <label class="fld"><span data-i18n="company"></span><input class="input" id="company" type="text" autocomplete="off" spellcheck="false"></label>
    </div>
    <div class="dest-row">
      <div class="dest-info" id="destInfo"></div>
      <div class="dest-actions">
      <button type="button" class="btn" id="destBtn">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2Z"/></svg>
        <span id="destBtnLabel"></span>
      </button>
      <span id="destInfoTip"><span class="info"><button type="button" class="info-btn" aria-describedby="destTip" data-i18n-aria="aboutDest">i</button><span class="tip" role="tooltip" id="destTip" data-i18n="destHint"></span></span></span>
      </div>
    </div>
    <p class="dest-hint" id="destHint" hidden></p>
  </section>

  <div class="dt-grid">
    <section class="box">
      <h2 class="sec"><span class="num">02</span><span data-i18n="datesTitle"></span><small id="datesCount"></small></h2>
      <div class="row">
        <input class="input date-in" id="calDate" type="date" data-i18n-aria="date">
        <button type="button" class="btn" id="addDateBtn">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M16 3v4M8 3v4M3 10h18M12 14v4M10 16h4"/></svg>
          <span data-i18n="addDate"></span>
        </button>
      </div>
      <div class="chips" id="chips"></div>
      <div class="nsd" id="nsd"></div>
      <hr class="sep">
      <label class="opt"><span data-i18n="format"></span>
        <select class="input sel-sm" id="dateFormat">
          <option value="YYYYMMDD">YYYYMMDD</option>
          <option value="MMDDYYYY">MMDDYYYY</option>
          <option value="DDMMYYYY">DDMMYYYY</option>
        </select>
      </label>
      <label class="switch opt"><span data-i18n="prefix"></span><input type="checkbox" id="usesDatePrefix"></label>
      <label class="switch opt"><span data-i18n="suffix"></span><input type="checkbox" id="usesDateSuffix"></label>
      <label class="switch opt"><span><span data-i18n="multi"></span> <span class="info"><button type="button" class="info-btn" aria-describedby="multiTip" data-i18n-aria="aboutMulti">i</button><span class="tip" role="tooltip" id="multiTip" data-i18n="multiHelp"></span></span></span><input type="checkbox" id="usesMultiDayFolders" disabled></label>
      <label class="switch opt"><span data-i18n="numbered"></span><input type="checkbox" id="usesNumberedSubfolders"></label>
      <label class="switch opt"><span data-i18n="sectionDate"></span><input type="checkbox" id="usesDateSuffixInSections"></label>
      <div class="opt">
        <span data-i18n="offset"></span>
        <div class="stepper">
          <button type="button" class="icon-btn" id="offsetDown" aria-label="−">−</button>
          <output id="offsetOut">0</output>
          <button type="button" class="icon-btn" id="offsetUp" aria-label="+">+</button>
        </div>
      </div>
    </section>

    <section class="box preview">
      <h2 class="sec"><span data-i18n="previewTitle"></span><small data-i18n="previewSub"></small></h2>
      <ul class="tree" id="tree"></ul>
    </section>
  </div>

  <section class="box">
    <div class="sec-head">
      <h2 class="sec"><span class="num">03</span><span data-i18n="secTitle"></span><small id="secCount"></small> <span class="info"><button type="button" class="info-btn" aria-describedby="secTip" data-i18n-aria="aboutSections">i</button><span class="tip" role="tooltip" id="secTip" data-i18n="secHelp"></span></span></h2>
      <button type="button" class="btn" id="addSectionBtn">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
        <span data-i18n="addSection"></span>
      </button>
    </div>
    <div class="sections" id="sections"></div>
  </section>

  <section class="box create-bar">
    <div>
      <p class="create-title"><span id="createTitle"></span> <span class="info"><button type="button" class="info-btn" aria-describedby="createTip" data-i18n-aria="aboutCreate">i</button><span class="tip" role="tooltip" id="createTip" data-i18n="createHint"></span></span></p>
    </div>
    <button type="button" class="btn primary" id="reviewBtn">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="m11 8 4 4-4 4M8 12h7"/></svg>
      <span data-i18n="review"></span>
    </button>
  </section>
</main>

<div class="modal" id="review" hidden>
  <div class="dialog" role="dialog" aria-modal="true" aria-labelledby="reviewTitle">
    <div class="dlg-head">
      <div>
        <h2 id="reviewTitle" data-i18n="reviewTitle"></h2>
        <p id="reviewSub"></p>
      </div>
      <button type="button" class="icon-btn" data-close data-i18n-aria="close">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"/></svg>
      </button>
    </div>
    <div class="dlg-body">
      <p class="review-note" id="reviewNote" hidden></p>
      <p class="list-label" data-i18n="checkedFolders"></p>
      <ul class="review-list" id="reviewList"></ul>
    </div>
    <div class="dlg-foot">
      <button type="button" class="btn" data-close data-i18n="cancel"></button>
      <button type="button" class="btn" id="zipBtn" data-i18n="zip"></button>
      <button type="button" class="btn primary" id="createBtn" data-i18n="create"></button>
    </div>
  </div>
</div>

<div class="modal" id="manage" hidden>
  <div class="dialog narrow" role="dialog" aria-modal="true" aria-labelledby="manageTitle">
    <div class="dlg-head">
      <div>
        <h2 id="manageTitle" data-i18n="manageTitle"></h2>
        <p data-i18n="manageSub"></p>
      </div>
      <button type="button" class="icon-btn" data-close data-i18n-aria="close">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"/></svg>
      </button>
    </div>
    <div class="dlg-body">
      <p class="hint" id="tplEmpty" data-i18n="tplEmpty"></p>
      <ul class="tpl-list" id="tplList"></ul>
    </div>
    <div class="dlg-foot">
      <button type="button" class="btn" id="importBtn" data-i18n="importTpl"></button>
      <button type="button" class="btn" id="exportBtn" data-i18n="exportTpl"></button>
      <button type="button" class="btn primary" data-close data-i18n="close"></button>
    </div>
    <input type="file" id="importInput" accept="application/json,.json" hidden>
  </div>
</div>

<div class="modal" id="dlg" hidden>
  <div class="dialog narrow" role="alertdialog" aria-modal="true" aria-labelledby="dlgTitle">
    <div class="dlg-head"><div><h2 id="dlgTitle"></h2><p id="dlgMsg"></p></div></div>
    <div class="dlg-body" id="dlgBody" hidden>
      <input class="input" id="dlgInput" type="text" maxlength="120" autocomplete="off">
      <p class="field-error" id="dlgError" hidden></p>
    </div>
    <div class="dlg-foot" id="dlgActions"></div>
  </div>
</div>

<script src="disktree.js"></script>
<script src="../info-tips.js"></script>
</body>
</html>
